name: ECR Login
description: Log in to our ECR accounts across environments

inputs:
  app-id:
    description: "GitHub App ID"
  private-key:
    description: "GitHub App Private Key"
  pr-title:
    description: "PR title"
  pr-body:
    description: "PR body"
  pr-branch:
    description: "branch to push to for PR"
outputs:
  pull-request-number:
    description: "PR number of the created Pull Request"
    value: ${{ steps.create-pr.outputs.pull-request-number }}

runs:
  using: "composite"
  steps:
    - name: Get codestyle bot token
      id: bot-token
      uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
      with:
        app_id: ${{ inputs.app-id }}
        private_key: ${{ inputs.private-key }}
    - name: Create PR
      uses: peter-evans/create-pull-request@70a41aba780001da0a30141984ae2a0c95d8704e # v6.0.2
      id: create-pr
      with:
        title: ${{ inputs.pr-title }}
        body: ${{ inputs.pr-body }}
        commit-message: |
          ${{ inputs.pr-title }}
          ${{ inputs.pr-body }}
        base: main
        branch: ${{ inputs.pr-branch }}
        labels: automerge,no-autoplan
    - uses: hmarr/auto-approve-action@44888193675f29a83e04faf4002fa8c0b537b1e4  # v3.2.1
      if: ${{ steps.create-pr.outputs.pull-request-number }}
      with:
        github-token: ${{ steps.bot-token.outputs.token}}
        pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
    - name: Merge PR
      uses: "pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67" # v0.16.4
      if: ${{ steps.create-pr.outputs.pull-request-number }}
      env:
        GITHUB_TOKEN: ${{ steps.bot-token.outputs.token}}
        MERGE_METHOD: rebase
        MERGE_READY_STATE: clean,has_hooks,unknown,unstable,blocked
        PULL_REQUEST: ${{ steps.create-pr.outputs.pull-request-number }}
