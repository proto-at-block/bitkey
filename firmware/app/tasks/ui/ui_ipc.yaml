port_name: ui_port

includes:
  - ui_events.h

messages:
  structs:
    # High-level UI events (cross-platform)
    - name: ui_show_event_t
      fields:
        - uint32_t event        # ui_event_type_t
    - name: ui_show_event_with_data_t
      fields:
        - uint32_t event        # ui_event_type_t
        - uint32_t data_len     # Actual length of data
        - ui_event_payload_t data
    - name: ui_set_idle_state_t
      fields:
        - uint32_t idle_state   # ui_event_type_t
    - name: ui_display_action_t
      fields:
        - uint32_t action      # fwpb_display_action_display_action_type
        - uint32_t data        # Optional data for EXIT/DELETE_FINGERPRINT actions
