message unlock_device_cmd {
}

// DEVELOPMENT ONLY: Response to `unlock_device_cmd`
message unlock_device_rsp {
  // Possible status codes returned in the response.
  enum unlock_device_rsp_status {
    // Unknown error.
    UNSPECIFIED = 0;

    // Device was successfully unlocked.
    SUCCESS = 1;
  }

  // Response to the unlock command.
  unlock_device_rsp_status rsp_status = 1;
}

