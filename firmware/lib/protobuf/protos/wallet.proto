syntax = "proto3";

package fwpb;

import "nanopb.proto";
import "mfgtest.proto";
import "secure-channel.proto";
import "ops-keybundle.proto";
import "ops-keys.proto";
import "ops-seal.proto";

// IMPORTANT: Must match secure_boot_config_t.
enum secure_boot_config {
  SECURE_BOOT_CONFIG_UNSPECIFIED = 0;
  SECURE_BOOT_CONFIG_DEV = 1;
  SECURE_BOOT_CONFIG_PROD = 2;
}

enum mcu_role {
  // Default role. The core MCU implements the core functionality of the
  // product. We make this the default as Wallet commands were originally
  // designed for a single MCU architecture.
  MCU_ROLE_CORE = 0;

  // User experience chip.
  MCU_ROLE_UXC = 1;
}

enum mcu_name {
  // Default chip. We make the EFR32 the default as Wallet commands and
  // responses were originally designed for a single MCU architecture.
  MCU_NAME_EFR32 = 0;

  // STM32U5
  MCU_NAME_STM32U5 = 1;
}

message fingerprint_handle {
  uint32 index = 1;
  string label = 2 [(nanopb).max_size = 33];
}

message se_info {
  uint32 version = 1;
  uint32 otp_version = 2;
  bytes serial = 3 [(nanopb).max_size = 16];

  // From sl_se_otp_init_t
  bool enable_secure_boot = 4;
  bool verify_secure_boot_certificate = 5;
  bool enable_anti_rollback = 6;
  bool secure_boot_page_lock_narrow = 7;
  bool secure_boot_page_lock_full = 8;
  bytes tamper_levels = 9 [(nanopb).max_size = 32];
  uint32 tamper_filter_period = 10;
  uint32 tamper_filter_threshold = 11;
  uint32 tamper_flags = 12;
  uint32 tamper_reset_threshold = 13;

  // sl_se_status_t
  uint32 boot_status = 14;
  uint32 se_fw_version = 15;
  uint32 host_fw_version = 16;
  // nested from sl_se_debug_status_t
  bool device_erase_enabled = 17;
  bool secure_debug_enabled = 18;
  bool debug_port_lock_applied = 19;
  bool debug_port_lock_state = 20;
  bytes debug_options_config = 21 [(nanopb).max_size = 4];
  bytes debug_options_state = 22 [(nanopb).max_size = 4];
  // end
  bool secure_boot_enabled = 23;
  uint32 tamper_status = 24;
  uint32 tamper_status_raw = 25;
}

message coredump_fragment {
  bytes data = 1 [(nanopb).max_size = 452];
  int32 offset = 2;
  bool complete = 3;  // Done processing a single coredump
  int32 coredumps_remaining = 4;
}

// Bitlog event fragment. Logs are encoded into bytestreams that split across
// a number of event fragments.
message event_fragment {
  // Bitlog event data bytes. There is at most 41 events per fragment.
  bytes data = 1 [(nanopb).max_size = 451];

  // Size (bytes) of events still remaining.
  int32 remaining_size = 2;
}

// Requests the metadata of a target MCU.
message meta_cmd {
  // Target MCU to request the metadata of.
  mcu_role mcu_role = 1;
}

message semver {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message firmware_metadata {
  // All string sizes must match lib/metadata.c structs, and have +1
  // to account for null terminator.
  bool valid = 1; // True if there was an error trying to get this metadata.
  string git_id = 2 [(nanopb).max_size = 65];
  string git_branch = 3 [(nanopb).max_size = 65];
  semver version = 4;
  string build = 5 [(nanopb).max_size = 8];
  uint64 timestamp = 6;
  bytes hash = 7 [(nanopb).max_size = 32];
  string hw_revision = 8 [(nanopb).max_size = 33];
}

enum firmware_slot {
  SLOT_UNSPECIFIED = 0;
  SLOT_A = 1;
  SLOT_B = 2;
}

// Fingerprint enrollment diagnostics.
message bio_diagnostics {
  bool finger_coverage_valid = 1;
  uint32 finger_coverage = 2;

  bool common_mode_noise_valid = 3;
  uint32 common_mode_noise = 4;

  bool image_quality_valid = 5;
  uint32 image_quality = 6;

  bool sensor_coverage_valid = 7;
  uint32 sensor_coverage = 8;

  bool template_data_update_valid = 9;
  uint32 template_data_update = 10;
}

message template_match_stats {
  uint32 pass_count = 1;
  semver firmware_version = 2;  // The firmware version this template was enrolled on
}

message bio_match_stats {
  repeated template_match_stats pass_counts = 1 [(nanopb).max_count = 3];  // Maximum of 3 fingers
  uint32 fail_count = 2;
}

// Response to a metadata command.
message meta_rsp {
  // Command response status codes.
  enum meta_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Command was successful.
    SUCCESS = 1;

    // Command failed.
    ERROR = 2;

    // Reserved (unused).
    reserved 3 to 9;
  }

  // Command response status code.
  meta_rsp_status rsp_status = 1;

  // Bootloader metadata.
  firmware_metadata meta_bl = 2;

  // Firmware metadata for the application in slot A.
  firmware_metadata meta_slot_a = 3;

  // Firmware metadata for the application in slot B.
  firmware_metadata meta_slot_b = 4;

  // Active firmware slot identifier.
  firmware_slot active_slot = 5;

  // Chip the metadata belongs to.
  mcu_name mcu_name = 6;

  // Role of the MCU this metadata belongs to.
  mcu_role mcu_role = 7;
}

// A command used by the mobile client to ask the hw device to start the fingerprint enrollment process.
message start_fingerprint_enrollment_cmd {
  fingerprint_handle handle = 1;
}

// The response for `start_fingerprint_enrollment_cmd `
message start_fingerprint_enrollment_rsp {
  enum start_fingerprint_enrollment_rsp_status {
    // Common error codes
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    UNAUTHENTICATED = 3;
    reserved 4 to 9;
  }

  start_fingerprint_enrollment_rsp_status rsp_status = 1;
}

// A command used by the mobile client to ask the hw device if fingerprints have been successfully enrolled.
message get_fingerprint_enrollment_status_cmd {
  // This flag is used to make the command behave as it used to.
  // This field should always be set to true.
  // If NOT set, the response will be COMPLETE if any fingerprint template exists.
  // If set, the response will be indicated by the actual state of enrollment at this moment in time, in
  // other words it accurately reflects the state of the enrollment process.
  bool app_knows_about_this_field = 1;
}

// The response for `get_fingerprint_enrollment_status_cmd `
message get_fingerprint_enrollment_status_rsp {
 enum get_fingerprint_enrollment_status_rsp_status {
    // Common error codes
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    reserved 3 to 9;
  }

  enum fingerprint_enrollment_status {
    STATUS_UNSPECIFIED = 0; // Needs a different name to not conflict with `UNSPECIFIED` above.
    INCOMPLETE = 1;
    COMPLETE = 2;
    NOT_IN_PROGRESS = 3;
  }

  get_fingerprint_enrollment_status_rsp_status rsp_status = 1;
  fingerprint_enrollment_status fingerprint_status = 2;
  uint32 pass_count = 3;
  uint32 fail_count = 4;
  bio_diagnostics diagnostics = 5;
}

message delete_fingerprint_cmd {
  uint32 index = 1;
}

message delete_fingerprint_rsp {
  // Note: Uses the new-style global status code for response status.
}

message get_enrolled_fingerprints_cmd {}

message get_enrolled_fingerprints_rsp {
  uint32 max_count = 1;
  repeated fingerprint_handle handles = 2 [(nanopb).max_count = 3];
}

message set_fingerprint_label_cmd {
  fingerprint_handle handle = 1;
}

message set_fingerprint_label_rsp {
}

// A command used by the mobile client to ask the hw device the authentication status.
message query_authentication_cmd {}

// The response for `verify_authentication_cmd `
message query_authentication_rsp {
  enum query_authentication_rsp_status {
    UNSPECIFIED = 0;
    AUTHENTICATED = 1;
    UNAUTHENTICATED = 2;
    reserved 3 to 9;
  }

  query_authentication_rsp_status rsp_status = 1;
}

// A command used by the mobile client to ask the hw device to wipe its state.
// Should only be used in debug environments.
message wipe_state_cmd {}

// The response for `wipe_state_cmd `
message wipe_state_rsp {
  enum wipe_state_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    UNAUTHENTICATED = 3;
    reserved 4 to 9;
  }

  wipe_state_rsp_status rsp_status = 1;
}

// A command used by the mobile client to ask the hw device for its metadata.
message device_id_cmd {}

// The response for `device_id_cmd `
message device_id_rsp {
  // all strings are +1 for null terminator
  string mlb_serial = 1 [(nanopb).max_size = 17];
  bool mlb_serial_valid = 2;
  string assy_serial = 3 [(nanopb).max_size = 17];
  bool assy_serial_valid = 4;
}

enum fwup_mode {
  FWUP_MODE_NORMAL = 0;  // Default mode if not explicitly set.
  FWUP_MODE_DELTA_INLINE = 1;
  FWUP_MODE_DELTA_ONESHOT = 2;
}

// A command used to initiate an NFC transfer of a device firmware update.
message fwup_start_cmd {
  // Type of firmware update being performed.
  fwup_mode mode = 1;

  // Only used if doing a delta update.
  uint32 patch_size = 2;

  // Target MCU to send the message to.
  mcu_role mcu_role = 3;

  // Version of the firmware being transferred.
  // Firmware will display this and verify it matches the signed metadata after transfer.
  semver version = 4;

  // When true, the firmware will defer committing the signature to flash until
  // both UXC and Core updates have been verified.  Both chips reset together
  // into the new firmware.  Set on the UXC fwup_start to opt in; Core inherits
  // the setting for the session.  Old apps that omit this field get the legacy
  // behavior (immediate commit and reset per-MCU).
  bool defer_commit = 5;
}

// Response to the firmware update start command (`fwup_start_cmd`).
message fwup_start_rsp {
  // Command status response codes.
  enum fwup_start_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Firmware update was started successfully.
    SUCCESS = 1;

    // Error in starting firmware update.
    ERROR = 2;

    // Operation failed as device has not been unlocked.
    UNAUTHENTICATED = 3;

    // Reserved (unused).
    reserved 4 to 9;
  }

  // Status code in response to the FWUP start command.
  fwup_start_rsp_status rsp_status = 1;

  // Maximum flash write chunk size for the target.
  uint32 max_chunk_size = 2;
}

// Message sent from the host to finalize a firmware update.
//
// TODO: Consider changing this API; possible attack since these offsets can be
// controlled?
message fwup_finish_cmd {
  // Offset (in bytes) in the upgrade image to find the application properties.
  uint32 app_properties_offset = 1;

  // Offset (in bytes) in the update image to find the signature.
  uint32 signature_offset = 2;

  // Set to `true` if a bootloader upgrade should be performed.
  // Note that this may be denied if bootloader updates are disabled.
  bool bl_upgrade = 3;

  // Type of firmware update being performed.
  fwup_mode mode = 4;

  // Target MCU to send the message to.
  mcu_role mcu_role = 5;
}

// Response to a FWUP finish command (`fwup_finish_cmd`).
message fwup_finish_rsp {
  // Command status response codes.
  enum fwup_finish_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Operation was successful, device may reboot to apply the firmware
    // update.
    SUCCESS = 1;

    // Update failed, signature is invalid.
    SIGNATURE_INVALID = 2;

    // Update failed, downdating is not allowed.
    VERSION_INVALID = 3;

    // Generic error (shouldn't happen).
    ERROR = 4;

    // Operation was successful, device will now patch the firmware update.
    WILL_APPLY_PATCH = 5;

    // Operation failed as device has not been unlocked.
    UNAUTHENTICATED = 6;

    // Update failed, confirmed version does not match the flashed firmware version.
    CONFIRMATION_MISMATCH = 7;

    // Reserved (unused).
    reserved 8 to 9;
  }

  // Status code in response to the FWUP finish command.
  fwup_finish_rsp_status rsp_status = 1;
}

// Command sent from Core to UXC to commit a previously verified firmware
// signature to flash.  Part of the atomic FWUP reset protocol: UXC holds its
// verified signature in RAM until Core explicitly requests the commit.
message fwup_commit_sig_cmd {}

// Response to `fwup_commit_sig_cmd`.
message fwup_commit_sig_rsp {
  enum fwup_commit_sig_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Signature was successfully written to flash.
    SUCCESS = 1;

    // Signature write failed (flash error or no pending signature).
    ERROR = 2;
  }

  fwup_commit_sig_rsp_status rsp_status = 1;
}


// A command used to send chunked firmware update binary data.
message fwup_transfer_cmd {
  // Monotonically increasing sequence ID. Offset to write in flash is
  // computed by multiplying this value with the maximum chunk size for the
  // target MCU.
  uint32 sequence_id = 1;

  // FWUP data bytes. Must be divisible by the minimum flash write size for
  // the target:
  //   - EFR32: must be divisible by 4 (max: 452).
  //   - STM32U5: must be divisible by 8 (max: 448).
  bytes fwup_data = 2 [(nanopb).max_size = 452];

  // For delta updates, indicates the offset in flash to write the FWUP data
  // to.
  uint32 offset = 3;

  // Type of firmware update.
  fwup_mode mode = 4;

  // Target MCU to send the message to.
  mcu_role mcu_role = 5;
}

// Response to the FWUP transfer command (`fwup_transfer_cmd`).
message fwup_transfer_rsp {
  // Command status response codes.
  enum fwup_transfer_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Firmware data was successfully written to flash.
    SUCCESS = 1;

    // Error writing firmware data to flash.
    ERROR = 2;

    // Operation failed as device has not been unlocked.
    UNAUTHENTICATED = 4;

    // Reserved (unused).
    reserved 5 to 9;
  }

  // Status code in response to the FWUP transfer command.
  fwup_transfer_rsp_status rsp_status = 1;
}

// W3 transaction signing - Start signing session
message sign_start_cmd {
  // Size of the PSBT in bytes
  uint32 psbt_size = 1;
}

message sign_start_rsp {
  // Command status response codes.
  enum sign_start_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Signing session started successfully.
    SUCCESS = 1;

    // Error starting signing session.
    ERROR = 2;

    // Operation failed as device has not been unlocked.
    UNAUTHENTICATED = 3;

    // Reserved (unused).
    reserved 4 to 9;
  }

  // Status code in response to the sign start command.
  sign_start_rsp_status rsp_status = 1;
}

// W3 transaction signing - Transfer PSBT chunk
message sign_transfer_cmd {
  // Monotonically increasing sequence ID for chunk ordering.
  uint32 sequence_id = 1;

  // PSBT chunk data bytes.
  bytes chunk_data = 2 [(nanopb).max_size = 452];
}

message sign_transfer_rsp {
  // Note: Uses the new-style global status code for response status.
  // SEQUENCE_ERROR maps to INVALID_STATE in the global status enum.
}


// Result message for sign transaction confirmation
message sign_transaction_rsp {
  // Command status response codes.
  enum sign_transaction_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // User confirmed, signing successful.
    SUCCESS = 1;

    // User denied the transaction.
    DENIED = 2;

    // Error during signing.
    ERROR = 3;

    // Operation failed as device has not been unlocked.
    UNAUTHENTICATED = 4;

    // Reserved (unused).
    reserved 5 to 9;
  }

  // Status code in response to the confirmation.
  sign_transaction_rsp_status rsp_status = 1;

  // Note: The actual signed PSBT data is retrieved via get_confirmation_result_chunk_cmd,
  // which returns the data in 452-byte chunks.
}

// Signals that chunked data is available after confirmation.
// Returned from get_confirmation_result when the operation produces large output data.
message chunked_data_info {
  // Total size of the data in bytes
  uint32 total_size = 1;
}

// Generic command to fetch chunked data after confirmation.
// Used to retrieve large result data in 452-byte chunks.
message get_confirmation_result_chunk_cmd {
  bytes response_handle = 1 [(nanopb).max_size = 32];
  bytes confirmation_handle = 2 [(nanopb).max_size = 32];
  // Zero-based chunk index. Firmware returns the same chunk for the same index,
  // enabling idempotent retry if NFC transmission fails.
  uint32 chunk_index = 3;
}

// Response containing a chunk of data from a confirmed operation.
message get_confirmation_result_chunk_rsp {
  // Chunk of data bytes.
  bytes chunk = 1 [(nanopb).max_size = 452];

  // True if this is the last chunk of data.
  bool is_last = 2;

  // Size (bytes) of data still remaining after this chunk (always non-negative).
  uint32 remaining_size = 3;
}

// Resets the MCU.
message reset_cmd {}

// Does nothing, only exists for consistency in the top-level proto.
message reset_rsp {}

message fuel_cmd {}

message fuel_rsp {
  uint32 repsoc = 1;
  uint32 vcell = 2;
  bool valid = 3;
}

message ship_state_cmd {
  bool shutdown_after = 1;
  uint32 shutdown_timeout_ms = 2;
}

message ship_state_rsp {
  enum ship_state_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
  }

  ship_state_rsp_status rsp_status = 1;
}

message coredump_get_cmd {
  enum coredump_get_type {
    UNSPECIFIED = 0;
    COUNT = 1;  // How many coredumps are there?
    COREDUMP = 2; // Get an actual coredump
  }

  coredump_get_type type = 1;
  uint32 offset = 2;
  mcu_role mcu_role = 3;
}

message coredump_get_rsp {
  enum coredump_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    reserved 3 to 9;
  }

  coredump_get_rsp_status rsp_status = 1;
  coredump_fragment coredump_fragment = 2;
  uint32 coredump_count = 3;
  mcu_role mcu_role = 4;
  mcu_name mcu_name = 5;
}

// Requests Bitlogs from the target MCU.
message events_get_cmd {
  // MCU role of the target.
  mcu_role mcu_role = 1;
}

// Response to the request for events from the MCU.
message events_get_rsp {
  // Enumeration of possible command statuses.
  enum events_get_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Command was successful.
    SUCCESS = 1;

    // Command failed due to an error.
    ERROR = 2;

    // Reserved (unused).
    reserved 3 to 9;
  }

  // Status code in response to the command.
  events_get_rsp_status rsp_status = 1;

  // Bitlog data format version.
  uint32 version = 2;

  // Encoded Bitlog event data.
  event_fragment fragment = 3;

  // MCU role of the responding chip.
  mcu_role mcu_role = 4;
}

enum feature_flag {
  FEATURE_FLAG_TELEMETRY = 0;
  FEATURE_FLAG_DEVICE_INFO_FLAG = 1; // Must have the _FLAG at the end of its name
                                     // because of `Enum variant names must not shadow type names:` when building core
  FEATURE_FLAG_RATE_LIMIT_TEMPLATE_UPDATE = 2;
  FEATURE_FLAG_UNLOCK = 3;
  FEATURE_FLAG_MULTIPLE_FINGERPRINTS = 4;
  FEATURE_FLAG_IMPROVED_FINGERPRINT_ENROLLMENT = 5;  // This does not control the feature, but flags support to the app.
  FEATURE_FLAG_ASYNC_SIGNING = 6;  // This does not control the feature, but flags support to the app.
  FEATURE_FLAG_SIGNING_OPTIMIZATIONS = 7;
  FEATURE_FLAG_FINGERPRINT_RESET = 8;
  // Add new feature flags here; do not remove any!
}

message feature_flag_cfg {
  feature_flag flag = 1;
  bool enabled = 2;
}

message feature_flags_get_cmd {
}

message feature_flags_get_rsp {
  enum feature_flags_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    reserved 3 to 9;
  }

  feature_flags_get_rsp_status rsp_status = 1;

  // List of supported feature flags and if they are enabled/disabled.
  // Must be large enough to fit all feature flags.
  repeated feature_flag_cfg flags = 2 [(nanopb).max_count = 32];
}

message feature_flags_set_cmd {
  // Must be large enough to fit all feature flags.
  repeated feature_flag_cfg flags = 1 [(nanopb).max_count = 32];
}

message feature_flags_set_rsp {
  enum feature_flags_set_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    reserved 3 to 9;
  }

  feature_flags_set_rsp_status rsp_status = 1;
}

message telemetry_id_get_cmd {
}

message telemetry_id_get_rsp {
  enum telemetry_id_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    reserved 3 to 9;
  }

  telemetry_id_get_rsp_status rsp_status = 1;

  string serial = 2 [(nanopb).max_size = 17];
  semver version = 3;
  string sw_type = 4 [(nanopb).max_size = 33];  // e.g. app-a-dev
  string hw_revision = 5 [(nanopb).max_size = 33]; // e.g. evt
}

message secinfo_get_cmd {
}

message secinfo_get_rsp {
  enum secinfo_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    OTP_READ_FAIL = 2;
    UNIMPLEMENTED = 3;
    reserved 4 to 9;
  }

  secinfo_rsp_status rsp_status = 1;
  se_info se_info = 2;
}

message cert_get_cmd {
  enum cert_type {
    UNSPECIFIED = 0;
    BATCH_CERT = 1;
    DEVICE_SE_CERT = 2;
    DEVICE_HOST_CERT = 3;
    DEVICE_SECURE_CHANNEL_CERT = 4;
  }

  enum cert_origin {
    // Return cert from this device's local store (identity or pinned peer cert).
    CERT_ORIGIN_LOCAL = 0;
    // Request cert from the peer MCU (Core forwards to UXC, returns UXC's response).
    CERT_ORIGIN_PEER = 1;
  }

  cert_type kind = 1;
  // For DEVICE_SECURE_CHANNEL_CERT: specifies which certificate to export.
  string cert_id = 2 [(nanopb).max_size = 32];
  // For DEVICE_SECURE_CHANNEL_CERT on W3: LOCAL = local read, PEER = request from UXC. Default LOCAL.
  cert_origin cert_source = 3;
}

message cert_get_rsp {
  enum cert_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    CERT_READ_FAIL = 2;
    UNIMPLEMENTED = 3;
    reserved 4 to 9;
  }

  cert_get_rsp_status rsp_status = 1;
  bytes cert = 2 [(nanopb).max_size = 512];
}

message pubkeys_get_cmd {
}

message pubkeys_get_rsp {
  enum pubkeys_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    PUBKEYS_READ_FAIL = 2;
    UNIMPLEMENTED = 3;
    reserved 4 to 9;
  }

  pubkeys_get_rsp_status rsp_status = 1;
  bytes boot_pubkey = 2 [(nanopb).max_size = 64];
  bytes auth_pubkey = 3 [(nanopb).max_size = 64];
  bytes attesation_pubkey = 4 [(nanopb).max_size = 64];
  bytes se_attestation_pubkey = 5 [(nanopb).max_size = 64];
}

message pubkey_get_cmd {
  enum pubkey_type {
    UNSPECIFIED = 0;
    BOOT_PUBKEY = 1;
    AUTH_PUBKEY = 2;
    ATTESTATION_PUBKEY = 3;
    SE_ATTESTATION_PUBKEY = 4;
  }

  pubkey_type kind = 1;
}

message pubkey_get_rsp {
  enum pubkey_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    PUBKEY_READ_FAIL = 2;
    UNIMPLEMENTED = 3;
    reserved 4 to 9;
  }

  pubkey_get_rsp_status rsp_status = 1;
  bytes pubkey = 2 [(nanopb).max_size = 64];
}

message fingerprint_settings_get_cmd {
}

message fingerprint_settings_get_rsp {
  enum fingerprint_settings_get_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    FINGERPRINT_SETTINGS_READ_FAIL = 2;
    UNIMPLEMENTED = 3;
    reserved 4 to 9;
  }

  fingerprint_settings_get_rsp_status status = 1;
  bool security_enabled = 2;
  bool otp_locked = 3;
}

message cap_touch_cal_cmd {}

message cap_touch_cal_rsp {
  enum cap_touch_cal_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    UNSUPPORTED = 3;
    reserved 4 to 9;
  }

  cap_touch_cal_status status = 1;
}

message empty_cmd {}
message empty_rsp {}

// A command to show a confirmation screen (checkmark + text) on the device display.
// Used by the app to provide visual feedback after operations like hardware presence checks.
// The text is resolved firmware-side to prevent a compromised app from showing arbitrary text.
message show_confirmation_screen_cmd {
  enum confirmation_screen_type {
    APPROVED = 0;
    SUCCESS = 1;
  }
  confirmation_screen_type type = 1;
  bool lock_on_dismiss = 2;
}
message show_confirmation_screen_rsp {}

// This command is sent on each NFC interaction from the mobile apps,
// and the response must be kept as small as possible.
message device_info_cmd {
}

// Response to the device information command (`device_info_cmd`).
message device_info_rsp {
  // Enumeration of command status response codes.
  enum device_info_rsp_status {
    // Unused.
    UNSPECIFIED = 0;

    // Command was successful.
    SUCCESS = 1;

    // Generic error.
    ERROR = 2;

    // Error retrieving firmware metadata.
    METADATA_ERROR = 3;

    // Error reading serial number from flash.
    SERIAL_ERROR = 4;

    // Error reading charge information from the fuel gauge.
    BATTERY_ERROR = 5;

    // Reserved (unused).
    reserved 6 to 9;
  }

  // MCU information.
  message device_info_mcu {
    // MCU role within the device.
    mcu_role mcu_role = 1;

    // Microcontroller chip name.
    mcu_name mcu_name = 2;

    // Semantic version of the application image on the MCU.
    semver version = 3;

    // Unique MCU chip identifier.
    bytes chip_id = 4 [(nanopb).max_size = 16];

    // Active firmware slot for this MCU (for delta FWUP patch selection).
    firmware_slot active_slot = 5;
  }

  // Command status code.
  device_info_rsp_status rsp_status = 1;

  // Semantic version of the active (Core) MCU application image.
  semver version = 2;

  // Top-level assembly (assy) serial number.
  string serial = 3 [(nanopb).max_size = 17];

  // Application image variant (e.g. `app-a-dev`).
  string sw_type = 4 [(nanopb).max_size = 33];

  // Hardware revision (e.g. `evt`, `dvt`).
  string hw_revision = 5 [(nanopb).max_size = 33];

  // Active firmware slot on the main (Core) MCU.
  firmware_slot active_slot = 6;

  // Information about the MCUs within the device.
  repeated device_info_mcu device_info_mcus = 13 [(nanopb).max_count = 2];

  // -----------------------------------------------------------------------------
  // Frequently changing information.
  // -----------------------------------------------------------------------------

  // Current battery state-of-charge (SOC) as a percent: [0..100].
  uint32 battery_charge = 7;

  // Battery voltage in mV.
  uint32 vcell = 8;

  // Average current in milliamps. Negative implies discharging.
  int32 avg_current_ma = 9;

  // Unused.
  uint32 battery_cycles = 10;

  // Secure boot configuration.
  secure_boot_config secure_boot_config = 11;

  // Fingerprint unlock statistics.
  bio_match_stats bio_match_stats = 12;
}

