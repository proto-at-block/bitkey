  bytes descriptor_backups_signature = 1 [(nanopb).max_size = 64];
  bytes activate_keyset_signature = 2 [(nanopb).max_size = 64];
  bytes unsealed_ddk_data = 3 [(nanopb).max_size = 32];
  bytes unsealed_ssek = 4 [(nanopb).max_size = 32];
}

// Lost-hw recovery tap 2: seals DDK private key, signs two SAP action proofs.
// Confirmable: returns CONFIRMATION_PENDING + handles; result via get_confirmation_result_rsp.
message recovery_authorize_lost_hw_cmd {
  bytes ddk_private_key = 1 [(nanopb).max_size = 32];
  string descriptor_backups_bindings = 2 [(nanopb).max_size = 256];
  string activate_keyset_bindings = 3 [(nanopb).max_size = 256];
  uint32 action_proof_version = 4;
}

message recovery_authorize_lost_hw_rsp {
  bytes descriptor_backups_signature = 1 [(nanopb).max_size = 64];
  bytes activate_keyset_signature = 2 [(nanopb).max_size = 64];
  sealed_data sealed_ddk_data = 3;
}

// Composite command for W3 upgrade: signs both descriptor-backup and keyset-activation
// action proofs and optionally seals the DDK private key, all in a single confirmable tap.
// Firmware shows "Approve wallet upgrade" prompt. After user confirms, the result is returned
// via get_confirmation_result_rsp.
message upgrade_authorize_w3_cmd {
  bytes ddk_private_key = 1 [(nanopb).max_size = 32];
  string descriptor_backups_bindings = 2 [(nanopb).max_size = 256];
  string activate_keyset_bindings = 3 [(nanopb).max_size = 256];
  uint32 action_proof_version = 4;
}

message upgrade_authorize_w3_rsp {
  bytes descriptor_backups_signature = 1 [(nanopb).max_size = 64];
  bytes activate_keyset_signature = 2 [(nanopb).max_size = 64];
  sealed_data sealed_ddk_data = 3;
}

// Unseals a sealed symmetric key during EEK (Emergency Exit Kit) restoration
// with user confirmation. Firmware shows a confirmation prompt on screen.
// Returns CONFIRMATION_PENDING + handles; unsealed key via get_confirmation_result_rsp.
message eek_restoration_unseal_symmetric_key_cmd {
  sealed_data sealed_key = 1;
}

// Returned in get_confirmation_result_rsp after user confirms EEK key unsealing.
message eek_restoration_unseal_symmetric_key_rsp {
  bytes unsealed_key = 1 [(nanopb).max_size = 32];
}

// Confirms the user's intent to decrypt full account cloud backups.
// After approval, the app may repeatedly call the continue command in the same
// NFC session with different sealed CSEKs until one succeeds.
message full_account_cloud_backup_restoration_cmd {}

// Returned in get_confirmation_result_rsp once the user approves full account
// cloud backup restoration on-device. Carries no payload; success means the
// session is ready for continuation commands.
message full_account_cloud_backup_restoration_rsp {}

// Continuation command for full account cloud backup restoration.
// Must be sent within the same NFC session after confirmation succeeds.
// The app streams sealed CSEKs one at a time. When firmware successfully
// unseals one, it returns the unsealed key along with its index.
message full_account_cloud_backup_restoration_continue_cmd {
  sealed_data sealed_csek = 1;
  // Zero-based index of this CSEK in the caller's list of candidates.
  uint32 csek_index = 2;
  // Session binding: must echo the response_handle from the initial
  // full_account_cloud_backup_restoration_rsp to prove the caller is the
  // same party that initiated and confirmed the session.
  bytes session_token = 3 [(nanopb).max_size = 32];
}

// Response for full_account_cloud_backup_restoration_continue_cmd.
// On success, returns the unsealed CSEK and the index that was provided in the command.
// On failure (firmware cannot unseal), the command returns an error status and the app
// should send the next candidate.
message full_account_cloud_backup_restoration_continue_rsp {
  bytes unsealed_csek = 1 [(nanopb).max_size = 32];
  // Echo of csek_index from the command, so the app can correlate the result.
  uint32 csek_index = 2;
}

// Display unit preference for Bitcoin amounts shown on the hardware screen
// during transaction confirmation. The app sends this with each signing command;
// the hardware applies it for the current session without persisting.
enum btc_display_unit {
  // Display amounts in the fractional unit (satoshi / ₿).
  BTC_DISPLAY_UNIT_SATOSHI = 0;
  // Display amounts in the main unit (BTC).
  BTC_DISPLAY_UNIT_BITCOIN = 1;
}

// Per-input data for the non-PSBT transaction signing protocol.
message sign_tx_input {
  bytes prev_txid = 1 [(nanopb).max_size = 32];
  uint32 prev_index = 2;
  uint32 sequence = 3;
  uint64 amount = 4;
  // BIP-84/86 paths are exactly 5 levels (e.g. m/84'/0'/0'/0/7).
  repeated uint32 derivation_path = 5 [(nanopb).max_count = 5];
}

// Per-output data for the non-PSBT transaction signing protocol.
message sign_tx_output {
  uint64 amount = 1;
  // Covers all standard script types: P2WPKH (22), P2WSH (34), P2TR (34).
  bytes destination_spk = 2 [(nanopb).max_size = 35];
  // BIP-84/86 paths are exactly 5 levels (e.g. m/84'/0'/0'/1/0).
  repeated uint32 derivation_path = 3 [(nanopb).max_count = 5];
  bool has_derivation_path = 4;
}

// Command to request transaction signing using decomposed transaction fields
// instead of a full PSBT. The hardware reconstructs the transaction from these
// fields, displays it for user confirmation, and computes sighashes.
// max_count kept small to fit in EFR32 RAM (each entry is statically allocated
// by nanopb and the NFC pool keeps 4 copies of wallet_cmd).
// For transactions with more than 5 inputs/outputs, use the PSBT-based
// sign_start_cmd + sign_transfer_cmd chunked flow instead.
message sign_tx_request_cmd {
  uint32 lock_time = 1;
  repeated sign_tx_input inputs = 2 [(nanopb).max_count = 5];
  repeated sign_tx_output outputs = 3 [(nanopb).max_count = 5];

  // Transaction version (e.g. 1 or 2). Used in BIP143 sighash preimage.
  // Must match the version of the transaction the app will broadcast.
  uint32 version = 4;

  // Display preferences for the hardware screen during transaction confirmation.
  // Sent by the app with each signing command; not persisted by firmware.
  btc_display_unit btc_display_unit = 5;
}

// Per-input signature produced by the hardware during non-PSBT signing.
message input_signature {
  uint32 input_index = 1;
  bytes public_key = 2 [(nanopb).max_size = 33];
  bytes signature = 3 [(nanopb).max_size = 73];
}

// Response containing all input signatures from a confirmed non-PSBT signing.
// Used by sign_tx_request_cmd (≤5 inputs). For streaming signing (>5 inputs),
// signatures are retrieved one at a time via get_tx_signature_cmd.
message sign_tx_response {
  repeated input_signature signatures = 1 [(nanopb).max_count = 5];
}

// =============================================================================
// Streaming transaction signing protocol
// =============================================================================
// For transactions with more inputs/outputs than sign_tx_request_cmd can handle
// (limited to 5 by nanopb static allocation × NFC pool copies), the streaming
// protocol sends the same compact fields in 452-byte NFC chunks. The firmware
// accumulates BIP143 intermediate hashes incrementally during receive, then
// computes per-input sighashes on demand after user confirmation.
//
// Flow:
//   sign_stream_start_cmd  → sign_stream_start_rsp
//   sign_stream_transfer_cmd (×N chunks) → sign_stream_transfer_rsp
//   sign_stream_finalize_cmd → confirmation_pending (via global status)
//   get_confirmation_result_cmd → sign_stream_signatures_ready
//   get_tx_signature_cmd (×M inputs) → get_tx_signature_rsp

// Initiates a streaming signing session. Firmware allocates the session buffer
// and initializes SHA256 streaming contexts for BIP143 intermediate hashes.
message sign_stream_start_cmd {
  // Number of inputs in the transaction.
  uint32 num_inputs = 1;
  // Number of outputs in the transaction.
  uint32 num_outputs = 2;
  // Transaction version (e.g. 1 or 2). Used in BIP143 sighash preimage.
  uint32 version = 3;
  // Transaction lock_time.
  uint32 lock_time = 4;
  // Total size in bytes of the canonical payload that will be streamed.
  // Firmware uses this to detect truncation or padding attacks.
  uint32 payload_size = 5;

  // Display preferences for the hardware screen during transaction confirmation.
  // Sent by the app with each signing command; not persisted by firmware.
  btc_display_unit btc_display_unit = 6;
}

message sign_stream_start_rsp {
  enum sign_stream_start_rsp_status {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    ERROR = 2;
    UNAUTHENTICATED = 3;
    reserved 4 to 9;
  }
  sign_stream_start_rsp_status rsp_status = 1;
}

// Transfers a chunk of the canonical binary payload. Each chunk contains a
// contiguous slice of the flat binary encoding of inputs followed by outputs.
// Firmware parses records from the byte stream and updates BIP143 SHA256
// streaming contexts incrementally.
message sign_stream_transfer_cmd {
  // Monotonically increasing sequence ID for chunk ordering.
  uint32 sequence_id = 1;
  // Chunk of canonical payload bytes.
  bytes chunk_data = 2 [(nanopb).max_size = 452];
}

message sign_stream_transfer_rsp {
  // Note: Uses the new-style global status code for response status.
  // SEQUENCE_ERROR maps to INVALID_STATE in the global status enum.
}

// Finalizes the streaming session. Firmware:
// 1. Verifies total bytes received == payload_size from start_cmd
// 2. Finalizes BIP143 intermediate hashes (hashPrevouts, hashSequence, hashOutputs)
// 3. Computes commitment = SHA256(all streamed bytes in order)
// 4. Verifies commitment matches the app-provided hash (anti-tampering)
// 5. Validates change outputs belong to the wallet policy
// 6. Presents transaction details for user confirmation
//
// Returns CONFIRMATION_PENDING with handles via the global status code.
message sign_stream_finalize_cmd {
  // SHA256 hash of the entire canonical payload, computed by the app.
  // Firmware independently computes the same hash during streaming and
  // verifies they match. This ensures no byte was altered in transit.
  bytes commitment_hash = 1 [(nanopb).max_size = 32];
}

// sign_stream_finalize_rsp uses CONFIRMATION_PENDING global status with
// response_handle / confirmation_handle fields on wallet_rsp.
// No dedicated response message is needed.

// Signals that streaming signing is ready for per-input signature retrieval.
// Returned from get_confirmation_result after user approves.
message sign_stream_signatures_ready {
  // Number of inputs ready for signing. App uses this to iterate
  // get_tx_signature_cmd for i in 0..num_inputs-1.
  uint32 num_inputs = 1;
}

// Retrieves a single input's signature from a confirmed streaming signing session.
// Deterministic ECDSA (RFC 6979) makes this idempotent — NFC retries are safe
// with no extra buffer needed.
message get_tx_signature_cmd {
  // Zero-based index into the streamed inputs array.
  uint32 input_index = 1;
}

message get_tx_signature_rsp {
  // Compressed public key that produced this signature (33 bytes).
  bytes pubkey = 1 [(nanopb).max_size = 33];
  // DER-encoded ECDSA signature + sighash type byte (max 73 bytes).
  bytes signature = 2 [(nanopb).max_size = 73];
}

// Retrieves a batch of input signatures from a confirmed streaming signing session.
// Same as get_tx_signature_cmd but returns up to `count` signatures per response,
// reducing NFC round-trips from N to N/batch_size.
// Idempotent (RFC 6979 deterministic ECDSA).
message get_tx_signatures_batch_cmd {
  // Zero-based index of the first input to sign in this batch.
  uint32 start_index = 1;
  // Number of signatures to return (clamped to num_inputs - start_index).
  uint32 count = 2;
}

// Reuses the existing tx_signature layout (pubkey + signature) per entry.
message tx_signature_entry {
  bytes pubkey = 1 [(nanopb).max_size = 33];
  bytes signature = 2 [(nanopb).max_size = 73];
}

message get_tx_signatures_batch_rsp {
  repeated tx_signature_entry signatures = 1 [(nanopb).max_count = 10];
}

