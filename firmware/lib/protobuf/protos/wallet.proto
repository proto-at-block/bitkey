  // The derived address string
  string address = 1 [(nanopb).max_size = 128];
}

// Verifies the integrity signature over app spending, app auth, hw spending, hw auth, server spending keys
// and builds the wallet descriptor.
// If the signature is valid, the keys will be provisioned to the HW along with server chaincodes
// This command is only available on W3 devices (not W1).
message verify_keys_and_build_descriptor_cmd {
  // App spending public key (33-byte compressed secp256k1)
  bytes app_spending_key = 1 [(nanopb).max_size = 33];

  // App spending key chaincode (32 bytes)
  bytes app_spending_key_chaincode = 2 [(nanopb).max_size = 32];

  // Network type: true = mainnet, false = testnet
  bool network_mainnet = 3;

  // App authentication public key (33-byte compressed secp256k1)
  bytes app_auth_key = 4 [(nanopb).max_size = 33];

  // Server spending public key (33-byte compressed secp256k1)
  bytes server_spending_key = 5 [(nanopb).max_size = 33];

  // Server spending key chaincode (32 bytes)
  bytes server_spending_key_chaincode = 6 [(nanopb).max_size = 32];

  // WSM signature over the keys (64-byte compact ECDSA signature)
  bytes wsm_signature = 7 [(nanopb).max_size = 64];

  // Account index for BIP84 derivation path (m/84'/coin'/account')
  // Defaults to 0 for backwards compatibility.
  // Valid range: 0-255 (stored as uint8_t in firmware keyset).
  uint32 account_index = 8;
}

message verify_keys_and_build_descriptor_rsp {
  // HW signature over the app global auth key (64-byte compact ECDSA signature)
  bytes app_auth_key_signature = 1 [(nanopb).max_size = 64];
}

enum status {
  UNSPECIFIED = 0;
  SUCCESS = 1;
  ERROR = 2;
  UNAUTHENTICATED = 3;
  UNKNOWN_MESSAGE = 4;
  NO_SECURE_CHANNEL = 5;
  KEY_DERIVATION_FAILED = 6;
  SIGNING_FAILED = 7;
  SECURE_CHANNEL_ERROR = 8;
  WRONG_SECRET = 9;
  STORAGE_ERR = 10;
  NO_SECRET_PROVISIONED = 11;
  WAITING_ON_DELAY = 12;
  FEATURE_NOT_SUPPORTED = 13;
  FILE_NOT_FOUND = 14;
  INVALID_STATE = 15;
  IN_PROGRESS = 16;
  INVALID_ARGUMENT = 17;
  VERIFICATION_FAILED = 18;
  REQUEST_MISMATCH = 19;
  VERSION_MISMATCH = 20;
  CONFIRMATION_PENDING = 21;
  CONFIRMATION_MISMATCH = 22;
  SEAL_CSEK_UNSEAL_FAILED = 23;
  DESCRIPTOR_NOT_LOADED = 24;
  CONFIRMATION_NOT_COMPLETED = 25;
}

message get_confirmation_result_cmd {
  bytes response_handle = 1 [(nanopb).max_size = 32];
  bytes confirmation_handle = 2 [(nanopb).max_size = 32];
}

message get_confirmation_result_rsp {
  oneof result {
    wipe_state_rsp wipe_state_result = 1;
    fwup_start_rsp fwup_start_result = 2;
    get_address_rsp get_address_result = 3;
    chunked_data_info chunked_data_available = 4;
    sign_action_proof_rsp sign_action_proof_result = 5;
    sign_tx_response sign_tx_result = 6;
    sign_stream_signatures_ready sign_stream_signatures_ready = 7;
    lost_app_recovery_ssek_rsp lost_app_recovery_ssek_rsp = 8;
    lost_app_recovery_sign_challenge_rsp lost_app_recovery_sign_challenge_result = 9;
    rotate_app_auth_keys_rsp rotate_app_auth_keys_rsp = 10;
    sign_challenge_and_seal_seks_rsp sign_challenge_and_seal_seks_result = 11;
    recovery_authorize_lost_app_rsp recovery_authorize_lost_app_result = 12;
    recovery_authorize_lost_hw_rsp recovery_authorize_lost_hw_result = 13;
    eek_restoration_unseal_symmetric_key_rsp eek_restoration_unseal_symmetric_key_result = 14;
    full_account_cloud_backup_restoration_rsp full_account_cloud_backup_restoration_result = 15;
    upgrade_authorize_w3_rsp upgrade_authorize_w3_result = 16;
    upgrade_rotate_app_auth_keys_rsp upgrade_rotate_app_auth_keys_rsp = 17;
  }
}

// Initiates lost app recovery. Firmware shows "Confirm Lost App Recovery?" prompt.
// After user confirms, the unsealed SSEK is returned via get_confirmation_result_rsp.
message lost_app_recovery_cmd {
  sealed_data sealed_ssek = 1;
}

// Returned in get_confirmation_result_rsp after user confirms lost app recovery.
message lost_app_recovery_ssek_rsp {
  bytes unsealed_ssek = 1 [(nanopb).max_size = 32];
}

// Continuation after app decrypts descriptors and extracts keys.
// Must be sent within the same NFC session as get_confirmation_result.
// The app passes canonical ActionProof fields to be signed by HW auth key.
// App computes next_account_index from existing descriptor keys, matching get_next_spending_key pattern.
message lost_app_recovery_continue_cmd {
  uint32 action_proof_version = 1;
  string action = 2 [(nanopb).max_size = 64];
  string value = 3 [(nanopb).max_size = 128];
  string bindings = 4 [(nanopb).max_size = 256];
  uint32 next_account_index = 5;
  btc_network network = 6;
  bytes app_global_auth_key = 7 [(nanopb).max_size = 33];
}

// Final response with all signatures and derived key.
message lost_app_recovery_continue_rsp {
  bytes action_proof_signature = 1 [(nanopb).max_size = 64];
  bytes bare_spending_key = 2 [(nanopb).max_size = 78];
  bytes app_auth_key_signature = 3 [(nanopb).max_size = 64];
  key_descriptor spending_key_descriptor = 4;
}

// Initiates rotate app auth keys. Firmware shows "Rotate App Auth Keys?" prompt.
// After user confirms, the action proof is signed along with account ID and app auth key.
// The result is returned via get_confirmation_result_rsp.
message rotate_app_auth_keys_cmd {
  uint32 action_proof_version = 1;
  string action = 2 [(nanopb).max_size = 64];
  string value = 3 [(nanopb).max_size = 128];
  string bindings = 4 [(nanopb).max_size = 256];
  string account_id = 5 [(nanopb).max_size = 64];
  string app_global_auth_key = 6 [(nanopb).max_size = 67];
}

// Returned in get_confirmation_result_rsp after user confirms rotate app auth keys.
message rotate_app_auth_keys_rsp {
  bytes action_proof_signature = 1 [(nanopb).max_size = 64];
  bytes hw_signed_account_id = 2 [(nanopb).max_size = 64];
  bytes app_auth_key_signature = 3 [(nanopb).max_size = 64];
  bytes hw_auth_public_key = 4 [(nanopb).max_size = 33];
}

// Initiates upgrade rotate app auth keys (W3 upgrade flow).
// Like rotate_app_auth_keys_cmd but without action proof signing.
// Firmware shows "Approve wallet upgrade" prompt. After user confirms,
// account ID and app auth key are signed and the HW auth public key is returned
// via get_confirmation_result_rsp.
message upgrade_rotate_app_auth_keys_cmd {
  string account_id = 1 [(nanopb).max_size = 64];
  string app_global_auth_key = 2 [(nanopb).max_size = 67];
}

// Returned in get_confirmation_result_rsp after user confirms upgrade rotate app auth keys.
message upgrade_rotate_app_auth_keys_rsp {
  bytes hw_signed_account_id = 1 [(nanopb).max_size = 64];
  bytes app_auth_key_signature = 2 [(nanopb).max_size = 64];
  bytes hw_auth_public_key = 3 [(nanopb).max_size = 33];
}

message sign_action_proof_cmd {
  uint32 version = 1;
  string action = 2 [(nanopb).max_size = 64];
  string value = 3 [(nanopb).max_size = 128];
  string bindings = 4 [(nanopb).max_size = 256];
}

message sign_action_proof_rsp {
  bytes signature = 1 [(nanopb).max_size = 64];
}

// Signs an auth challenge with user confirmation on the device screen.
// Used during lost app recovery to ensure the user physically approves
// the challenge signing. Returns CONFIRMATION_PENDING + handles.
message lost_app_recovery_sign_challenge_cmd {
  bytes challenge = 1 [(nanopb).max_size = 256];
}

// Returned in get_confirmation_result_rsp after user confirms challenge signing.
message lost_app_recovery_sign_challenge_rsp {
  bytes signature = 1 [(nanopb).max_size = 64];
}

// Signs D&N challenge with HW auth key and seals CSEK + SSEK with hardware sealing key.
// Confirmable: returns CONFIRMATION_PENDING + handles; result via get_confirmation_result_rsp.
message sign_challenge_and_seal_seks_cmd {
  bytes challenge = 1 [(nanopb).max_size = 256];
  bytes unsealed_csek = 2 [(nanopb).max_size = 32];
  bytes unsealed_ssek = 3 [(nanopb).max_size = 32];
}

message sign_challenge_and_seal_seks_rsp {
  bytes signature = 1 [(nanopb).max_size = 64];
  sealed_data sealed_csek = 2;
  sealed_data sealed_ssek = 3;
}

// Lost-app recovery tap 2: unseals DDK/SSEK, signs two SAP action proofs.
// Confirmable: returns CONFIRMATION_PENDING + handles; result via get_confirmation_result_rsp.
message recovery_authorize_lost_app_cmd {
  sealed_data sealed_ddk = 1;
  sealed_data sealed_ssek = 2;
  string descriptor_backups_bindings = 3 [(nanopb).max_size = 256];
  string activate_keyset_bindings = 4 [(nanopb).max_size = 256];
  uint32 action_proof_version = 5;
}

