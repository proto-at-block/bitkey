[package]
name = "emulator-launcher"
version = "0.1.0"
edition = "2021"
description = "Launcher daemon for core-sim and ui-simulate firmware emulator stack"

[[bin]]
name = "emulator-launcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
